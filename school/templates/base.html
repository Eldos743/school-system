<!doctype html>
<html lang="{{ 'kk' if lang == 'kz' else 'ru' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>{% block title %}{% endblock %} · Білім Ордасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: верхняя панель с навигацией по трём панелям, ниже — сводка, затем секции с таблицами и графиками. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --sunk: #eaeeea; --ink: #1a272b; --muted: #5a696c; --line: #d9dfdb;
  --accent: #1d6b86; --accent-soft: #dcebf0; --s2: #b7802a; --s2-soft: #f4e8d3;
  --good: #2c8250; --good-soft: #dcefe2; --warn: #b8780c; --warn-soft: #f7ebcf; --bad: #bf3d2a; --bad-soft: #f7dfda;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111718; --surface: #182022; --sunk: #141b1c; --ink: #e2eae9; --muted: #92a2a2; --line: #283335;
  --accent: #5db3d0; --accent-soft: #1b3640; --s2: #e0a952; --s2-soft: #3a2f1c;
  --good: #5cc287; --good-soft: #17342a; --warn: #e3b04a; --warn-soft: #3a3019; --bad: #ef7a66; --bad-soft: #3e211d;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111718; --surface: #182022; --sunk: #141b1c; --ink: #e2eae9; --muted: #92a2a2; --line: #283335;
  --accent: #5db3d0; --accent-soft: #1b3640; --s2: #e0a952; --s2-soft: #3a2f1c;
  --good: #5cc287; --good-soft: #17342a; --warn: #e3b04a; --warn-soft: #3a3019; --bad: #ef7a66; --bad-soft: #3e211d;
  color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* шапка */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; line-height: 1.2; margin-right: auto; }
.brand b { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .01em; color: var(--ink); }
.brand span { font-size: 12.5px; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.lang { font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.demo-tag { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--s2); background: var(--s2-soft); padding: 3px 8px; border-radius: 99px; font-weight: 600; }

/* заголовок страницы */
.head { padding-block: 28px 8px; display: grid; gap: 6px; }
.crumb { font-size: 13px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3.2vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.lead { color: var(--muted); max-width: 70ch; margin: 0; }
h2 { font-size: 17px; font-weight: 650; margin: 0; text-wrap: balance; }
h3 { font-size: 14px; font-weight: 600; margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* секции */
main { display: grid; gap: 20px; padding-block: 16px 48px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; align-content: start; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.grid2 > *, .grid3 > * { min-width: 0; }

/* сводные цифры */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px; display: grid; gap: 2px; align-content: start; }
.stat .k { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 500; line-height: 1.25; }
.stat .v small { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stat .d { font-size: 12.5px; color: var(--muted); }
.delta-up { color: var(--good); font-weight: 600; }
.delta-down { color: var(--bad); font-weight: 600; }

/* таблицы */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .02em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; }
td.c, th.c { text-align: center; }
tbody tr:hover { background: var(--sunk); }
.who { font-weight: 550; color: var(--ink); }
.sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }

/* KPI шкала */
.kpi { display: inline-flex; align-items: center; gap: 8px; min-width: 120px; }
.kpi b { width: 30px; text-align: right; font-weight: 650; }
.meter { flex: 1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 60px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter i.lo { background: var(--bad); }
.meter i.mid { background: var(--warn); }
.meter i.hi { background: var(--good); }

/* метки */
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-good { background: var(--good-soft); color: var(--good); }
.p-mute { background: var(--sunk); color: var(--muted); }
.p-acc { background: var(--accent-soft); color: var(--accent); }
.g2 { color: var(--bad); font-weight: 650; }
.g3 { color: var(--warn); font-weight: 650; }
.g4 { color: var(--ink); }
.g5 { color: var(--good); font-weight: 650; }

/* полосы-распределения */
.bars { display: grid; gap: 10px; }
.brow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 12px; align-items: center; font-size: 14px; }
.brow .track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.brow .track i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.brow .track i.s2 { background: var(--s2); }
.brow .track i.bad { background: var(--bad); }
.brow .num { font-weight: 600; min-width: 3ch; text-align: right; }

/* графики */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .val { font-size: 12px; font-weight: 650; font-family: var(--body); }
.chart .target { stroke: var(--bad); stroke-dasharray: 4 4; stroke-width: 1.2; }
.chart .target-l { fill: var(--bad); }
.line { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.line.s1 { stroke: var(--accent); } .line.s2 { stroke: var(--s2); } .line.s3 { stroke: var(--muted); stroke-dasharray: 5 4; stroke-width: 1.8; }
.area.s1 { fill: var(--accent); opacity: .1; } .area.s2 { fill: var(--s2); opacity: .12; }
.dot.s1 { fill: var(--accent); } .dot.s2 { fill: var(--s2); } .dot.s3 { fill: var(--muted); }
.dot.end { stroke: var(--surface); stroke-width: 2; }
.val.s1 { fill: var(--accent); } .val.s2 { fill: var(--s2); } .val.s3 { fill: var(--muted); }
.bar.s1 { fill: var(--accent); opacity: .75; } .bar.s2 { fill: var(--s2); opacity: .8; } .bar.hot { fill: var(--bad); opacity: .85; }
.spark { display: block; overflow: visible; }
.spark .line { stroke-width: 1.8; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--accent); }
.legend .l2::before { background: var(--s2); }
.legend .l3::before { background: var(--muted); }

/* списки */
.list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }
.alert { align-content: start; border: 1px solid var(--bad-soft); background: color-mix(in srgb, var(--bad-soft) 45%, var(--surface)); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; }
.alert h2 { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips a { padding: 5px 11px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink); font-size: 13.5px; background: var(--surface); }
.chips a.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chips a:hover { text-decoration: none; border-color: var(--accent); }
.formula { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px 24px; }
.formula div { display: grid; grid-template-columns: 44px 1fr; gap: 2px 10px; font-size: 13.5px; }
.formula b { font-family: var(--display); font-weight: 500; color: var(--accent); grid-row: span 2; font-size: 18px; }
.formula span { color: var(--muted); font-size: 12.5px; }
footer { color: var(--muted); font-size: 12.5px; padding-block: 0 32px; }
@media (max-width: 560px) {
  .sec { padding: 16px 14px; }
  .brow { grid-template-columns: minmax(0, 1fr) auto; }
  .brow .track { grid-column: 1 / -1; grid-row: 2; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .meter i, .brow .track i { transition: width .4s ease; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Білім Ордасы</b><span>{{ t('year') }}</span></div>
    <nav class="nav">
      <a href="{{ url_for('founder', lang=lang) }}" class="{{ 'on' if endpoint == 'founder' }}">{{ t('nav_founder') }}</a>
      <a href="{{ url_for('teachers', lang=lang) }}" class="{{ 'on' if endpoint in ('teachers', 'teacher') }}">{{ t('nav_teachers') }}</a>
      <a href="{{ url_for('students', lang=lang) }}" class="{{ 'on' if endpoint in ('students', 'student') }}">{{ t('nav_students') }}</a>
    </nav>
    <span class="demo-tag">{{ t('demo') }}</span>
    <a class="lang" href="{{ other_url }}">{{ t('lang_switch') }}</a>
  </div>
</header>
<div class="wrap">
  <div class="head">{% block head %}{% endblock %}</div>
  <main>{% block body %}{% endblock %}</main>
  <footer>{{ t('school') }} · {{ t('demo') }}</footer>
</div>
</body>
</html>
